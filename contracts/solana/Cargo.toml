[workspace]
resolver = "2"
members = [
    "programs/*"
]


[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
toml_datetime = { git = "https://github.com/toml-rs/toml", tag = "toml_datetime-v0.6.5" }
getrandom = { git = "https://github.com/rust-random/getrandom", tag = "v0.2.10" }







