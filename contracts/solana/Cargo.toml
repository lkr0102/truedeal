[workspace]
resolver = "2"
members = [
    "programs/*"
]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
indexmap = { git = "https://github.com/indexmap-rs/indexmap.git", tag = "2.2.6" }
hashbrown = { git = "https://github.com/rust-lang/hashbrown.git", tag = "v0.14.3" }
bytemuck = { git = "https://github.com/Lokathor/bytemuck.git", tag = "v1.16.0" }
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3.git", tag = "1.5.0" }
