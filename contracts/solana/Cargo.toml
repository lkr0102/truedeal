[workspace]
members = [
    "programs/*"
]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
block-buffer = { git = "https://github.com/RustCrypto/traits", rev = "70c79c8" } # block-buffer-v0.10.4
sha2 = { git = "https://github.com/RustCrypto/hashes", rev = "05c102c" }         # sha2-v0.10.8
toml_datetime = { git = "https://github.com/toml-rs/toml", rev = "98ec210" }    # toml_datetime-v0.6.5

