[package]
name = "truedeal"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "truedeal"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.17.0"
# Pinning to avoid edition 2024 conflict in SBF compiler
block-buffer = "=0.10.4"
sha2 = "=0.10.8"
toml_datetime = "=0.6.5"
