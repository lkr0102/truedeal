<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1500px; height: 500px; overflow: hidden; background: #fff; }

  .banner {
    width: 1500px;
    height: 500px;
    border-radius: 52px;
    background: linear-gradient(135deg, #00523A 0%, #008C3E 55%, #00B852 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 90px;
    gap: 80px;
  }

  /* Glow blobs */
  .banner::before {
    content: "";
    position: absolute;
    top: -20%;
    right: -5%;
    width: 600px;
    height: 600px;
    background: rgba(255,255,255,0.10);
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
  }
  .banner::after {
    content: "";
    position: absolute;
    bottom: -20%;
    left: 38%;
    width: 400px;
    height: 400px;
    background: rgba(0,0,0,0.12);
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
  }

  /* Logo block */
  .logo-block {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  .logo-circle {
    width: 180px;
    height: 180px;
    background: #00B852;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 0 14px rgba(255,255,255,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-align: center;
    line-height: 1.15;
  }

  .logo-label span {
    opacity: 0.65;
  }

  /* Tagline block */
  .tagline-block {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .tagline {
    font-family: 'DM Sans', sans-serif;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -2px;
    color: #fff;
    line-height: 1.25;
    margin-bottom: 40px;
  }

  .tagline .dim {
    opacity: 0.75;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.92);
    border-radius: 100px;
    padding: 20px 44px;
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #00523A;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="logo-block">
    <div class="logo-circle">
      <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <div class="logo-label">TRUE<br><span>DEAL</span></div>
  </div>

  <div class="tagline-block">
    <div class="tagline">
      Set your goals.<br>
      Honor your word.<br>
      <span class="dim">Get paid for it.</span>
    </div>
    <div class="cta">Set your goals now →</div>
  </div>
</div>
</body>
</html>
