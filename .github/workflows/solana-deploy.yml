name: Solana Contract Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ANCHOR_VERSION: "0.29.0"
      SOLANA_VERSION: "1.18.26"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (1.85.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev

      - name: Cache Anchor binary
        uses: actions/cache@v4
        id: cache-anchor
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo install --version ${{ env.ANCHOR_VERSION }} anchor-cli --locked

      - name: Add Cargo to Path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify tool versions
        run: |
          solana --version
          anchor --version

      - name: Setup Fee Payer Wallet
        env:
          SOLANA_PAYER_KEY: ${{ secrets.SOLANA_PAYER_KEY }}
        run: |
          mkdir -p ~/.config/solana
          echo "$SOLANA_PAYER_KEY" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json --url devnet
          solana balance

      - name: Setup Program Keypair
        env:
          TRUEDEAL_DEPLOY_KEY: ${{ secrets.TRUEDEAL_DEPLOY_KEY }}
        run: |
          mkdir -p contracts/solana/target/deploy
          echo "$TRUEDEAL_DEPLOY_KEY" > contracts/solana/target/deploy/truedeal-keypair.json
          chmod 600 contracts/solana/target/deploy/truedeal-keypair.json

      - name: Remove vendor config (use network)
        run: rm -f contracts/solana/.cargo/config.toml

      - name: Build Program
        run: |
          cd contracts/solana
          anchor build

      - name: Deploy to Devnet
        run: |
          cd contracts/solana
          anchor deploy --provider.cluster devnet
          echo "✅ Deploy concluído!"
          echo "🔗 https://solscan.io/account/885scJ15uLUjnG8tfPUFbx4pAS6ZCkHpSuFd9ZUaxFbZ?cluster=devnet"
          echo "🔗 https://explorer.solana.com/address/885scJ15uLUjnG8tfPUFbx4pAS6ZCkHpSuFd9ZUaxFbZ?cluster=devnet"

      - name: Verify Deployment
        run: |
          solana program show 885scJ15uLUjnG8tfPUFbx4pAS6ZCkHpSuFd9ZUaxFbZ --url devnet
