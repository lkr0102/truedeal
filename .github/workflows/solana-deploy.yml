name: Solana Contract Deploy

on:
  workflow_dispatch: # Permite disparo manual pela UI do GitHub
  push:
    branches:
      - main
    paths:
      - 'contracts/solana/**'
      - '.github/workflows/solana-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ANCHOR_VERSION: "0.30.1"
      SOLANA_VERSION: "2.1.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Rust (1.79.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0


      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Linux Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev

      - name: Cache Anchor binary
        uses: actions/cache@v4
        id: cache-anchor
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-0.30.1

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo install --version 0.30.1 anchor-cli --locked

      - name: Add Cargo to Path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify tool versions
        run: |
          solana --version
          anchor --version

      - name: Setup Deploy Wallet
        env:
          SOLANA_PAYER_KEY: ${{ secrets.SOLANA_PAYER_KEY }}
        run: |
          mkdir -p ~/.config/solana
          echo "$SOLANA_PAYER_KEY" > ~/.config/solana/deploy.json
          chmod 600 ~/.config/solana/deploy.json
          solana config set \
            --keypair ~/.config/solana/deploy.json \
            --url devnet
          solana balance

      - name: Build Program
        run: |
          cd contracts/solana
          anchor build


      - name: Deploy to Devnet
        run: |
          cd contracts/solana
          solana program deploy \
            --keypair ~/.config/solana/deploy.json \
            --url devnet \
            --program-id target/deploy/truedeal-keypair.json \
            target/deploy/truedeal.so
          echo "✅ Deploy concluído!"
          echo "🔗 https://explorer.solana.com/address/9zfQ1dwJ9Po7YCPWJ3S13ic3nxZcA9cEwBVsXdKub1c4?cluster=devnet"
